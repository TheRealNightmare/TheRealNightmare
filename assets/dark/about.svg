  <text x="174" y="66" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="400" fill="#e6edf3">Software developer based in Dhaka, Bangladesh.</text>
  <text x="174" y="88" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="400" fill="#e6edf3">Building web products at @Moner-Bondhu.</text>
  <text x="174" y="132" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="400" fill="#9198a1">Most of what I know came from building the thing</text>
  <text x="174" y="154" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="400" fill="#9198a1">badly first, then figuring out why it was bad.</text>
  <text x="174" y="176" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="400" fill="#9198a1">My time splits between full-stack web and Python.</text>
  <text x="174" y="198" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="400" fill="#9198a1">When something feels like magic, I rebuild it by</text>
  <text x="174" y="220" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="400" fill="#9198a1">hand until it doesn't. Autograd engines included.</text>
  <text x="174" y="264" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="400" fill="#a3e636">Ship small things that work &gt; plan big things that don't.</text>
