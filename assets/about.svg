  <text x="50" y="98" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="400" fill="#E6E6E6">Software developer based in Dhaka, Bangladesh.</text>
  <text x="50" y="120" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="400" fill="#E6E6E6">Building web products at @Moner-Bondhu.</text>
  <text x="50" y="164" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="400" fill="#8B8B8B">Most of what I know came from building the thing</text>
  <text x="50" y="186" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="400" fill="#8B8B8B">badly first, then figuring out why it was bad.</text>
  <text x="50" y="208" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="400" fill="#8B8B8B">My time splits between full-stack web and Python.</text>
  <text x="50" y="230" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="400" fill="#8B8B8B">When something feels like magic, I rebuild it by</text>
  <text x="50" y="252" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="400" fill="#8B8B8B">hand until it doesn't. Autograd engines included.</text>
  <text x="50" y="296" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="400" fill="#A3E636">Ship small things that work &gt; plan big things that don't.</text>
